<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>TikTok-Anmeldung — Code</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; line-height: 1.6; color: #222; }
  h1 { font-size: 1.4em; }
  code { display: block; background: #f4f4f6; border: 1px solid #ddd; border-radius: 8px;
         padding: 16px; margin: 20px 0; font-size: 1.05em; word-break: break-all; }
  .hint { color: #666; font-size: 0.92em; }
  .err { color: #b00020; }
  button { font-size: 1em; padding: 10px 18px; border-radius: 8px; border: 1px solid #bbb; cursor: pointer; }
</style>
</head>
<body>
<h1>TikTok-Anmeldung</h1>
<div id="out"></div>
<script>
  // Der Code steht als ?code=... in der Adresse. Diese Seite zeigt ihn nur an —
  // sie schickt ihn nirgendwohin. Kopieren und ins Terminal einfuegen.
  var p = new URLSearchParams(location.search);
  var code = p.get("code");
  var err = p.get("error") || p.get("error_description");
  var out = document.getElementById("out");

  if (code) {
    out.innerHTML =
      '<p>Fertig. Diesen Code kopieren und im Terminal einfuegen:</p>' +
      '<code id="c"></code>' +
      '<button id="b">Code kopieren</button>' +
      '<p class="hint">Danach kann dieser Tab geschlossen werden. Der Code ist nur wenige Minuten gueltig.</p>';
    document.getElementById("c").textContent = code;
    document.getElementById("b").onclick = function () {
      navigator.clipboard.writeText(code).then(function () {
        document.getElementById("b").textContent = "Kopiert";
      });
    };
  } else if (err) {
    out.innerHTML = '<p class="err">TikTok hat die Anmeldung abgebrochen:</p><code></code>';
    out.querySelector("code").textContent = err;
  } else {
    out.innerHTML = '<p class="hint">Diese Seite wird nur waehrend der TikTok-Anmeldung ' +
                    'aufgerufen. Direkt geoeffnet steht hier nichts.</p>';
  }
</script>
</body>
</html>
